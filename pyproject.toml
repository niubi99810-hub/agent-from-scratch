[project]
name = "agent-from-scratch"
version = "0.1.0"
description = "A dependency-free ReAct + function-calling agent runtime, written to be read"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]